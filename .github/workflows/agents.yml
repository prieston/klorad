name: Scheduled agents

# One workflow, six scheduled agents. Each job is gated to its own cron (or to a manual dispatch
# choice) and runs the matching prompt in `.agents/` via claude-code-action, on a fresh branch,
# never main, opening a PR or an issue as its output. Same shape as the nostii setup.
#
# Required repo secrets:
#   CLAUDE_CODE_OAUTH_TOKEN : all claude-code-action jobs (Claude subscription OAuth token)
#   MONDAY_API_TOKEN        : morning-digest (Command board 5104329444); nightly-build + board-sync
#                              (Development board 5104329450: the "Ready for agent" work queue)
# No database, storage or tenant credentials are ever provided here (see .agents/CLAUDE.md). Builds run
# with SKIP_ENV_VALIDATION=1; every vertical route is dynamic so nothing renders at build time.
# NOTE: scheduled + dispatch runs only fire from the DEFAULT branch once this is merged.

on:
  schedule:
    - cron: '0 1 * * *'    # nightly-regression
    - cron: '30 2 * * *'   # nightly-build (after regression)
    - cron: '30 4 * * *'   # board-sync (after nightly-build, before morning-digest)
    - cron: '15 5 * * *'   # morning-digest (~08:15 Athens)
    - cron: '30 6 * * 1'   # weekly-watch (Mon)
    - cron: '30 7 * * 1'   # weekly-content (Mon)
  workflow_dispatch:
    inputs:
      job:
        description: Which agent to run
        type: choice
        options:
          - nightly-regression
          - nightly-build
          - board-sync
          - morning-digest
          - weekly-watch
          - weekly-content

permissions:
  contents: write        # push agent branches
  pull-requests: write   # open PRs
  issues: write          # open issues
  id-token: write        # OIDC token (claude-code-action / cloud auth)
  actions: read          # morning-digest reads workflow runs

jobs:
  nightly-regression:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'nightly-regression') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: anthropics/claude-code-action@v1  # pin to a SHA once validated
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash,Read,Write,Edit,Grep,Glob --max-turns 40'
          prompt: |
            Read and follow `.agents/nightly-regression.md` exactly. Work on branch
            `agents/nightly-regression-${{ github.run_id }}` (never main). Follow `.agents/CLAUDE.md`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_ENV_VALIDATION: '1'

  # Board-driven: implements the top item of the Development board's "Ready for agent" group as one
  # small slice, drafts a PR, moves the item to "In review" (or asks a question -> "Needs decision").
  nightly-build:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 2 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'nightly-build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: anthropics/claude-code-action@v1  # pin to a SHA once validated
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash,Read,Write,Edit,Grep,Glob --max-turns 150'
          prompt: |
            Read and follow `.agents/nightly-build.md` exactly. Work on branch
            `agents/nightly-build-${{ github.run_id }}` (never main). Follow `.agents/CLAUDE.md`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          SKIP_ENV_VALIDATION: '1'

  # Reflects merged `board: ...` PRs back onto the board: moves the matching item to "Done" + records the
  # merge, then tops the "Ready for agent" queue up from the backlog.
  board-sync:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 4 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'board-sync') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1  # pin to a SHA once validated
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash,Read,Grep,Glob --max-turns 30 --model claude-sonnet-5'
          prompt: |
            Read and follow `.agents/board-sync.md` exactly. Read-only on the repo (no branch, no PR).
            Follow `.agents/CLAUDE.md`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}

  morning-digest:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 5 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'morning-digest') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1  # pin to a SHA once validated
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash,Read,Grep,Glob --max-turns 30 --model claude-sonnet-5'
          prompt: |
            Read and follow `.agents/morning-digest.md` exactly. Post exactly one item to monday and
            open the matching GitHub issue. Follow `.agents/CLAUDE.md`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}

  weekly-watch:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1') || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-watch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: anthropics/claude-code-action@v1  # pin to a SHA once validated
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash,Read,Grep,Glob --max-turns 40 --model claude-sonnet-5'
          prompt: |
            Read and follow `.agents/weekly-watch.md` exactly. Output is a single issue (PR only for a
            trivial hygiene fix on branch `agents/weekly-watch-${{ github.run_id }}`). Follow `.agents/CLAUDE.md`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_ENV_VALIDATION: '1'

  weekly-content:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 7 * * 1') || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-content') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1  # pin to a SHA once validated
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash,Read,Write,Edit,Grep,Glob --max-turns 40'
          prompt: |
            Read and follow `.agents/weekly-content.md` exactly. Open a DRAFT PR from branch
            `agents/weekly-content-${{ github.run_id }}` (never main). Follow `.agents/CLAUDE.md`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
